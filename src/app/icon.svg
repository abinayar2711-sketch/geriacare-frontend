<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Geriacare: a wave closing on itself into the letter G, drawn as a double helix">
  <title>Geriacare</title>

  <!-- The emblem at tab size. Everything the full mark says in 320 units
       has to survive in 16 pixels, so only three things are kept: the
       wave that closes into a G, the two strands, and the swell running
       through them. See src/components/Emblem.tsx for the full drawing. -->

  <style>
    /* The swell: a short bright dash travelling the length of the stroke.
       The water does not travel, only the shape does. Firefox animates
       SVG favicons; Chrome and Safari render frame one, so the static
       mark has to stand on its own — it does. */
    .swell {
      stroke-dasharray: 130 870;
      animation: swell 3.6s linear infinite;
    }
    .swell--b {
      animation-delay: -1.8s;
    }
    @keyframes swell {
      to { stroke-dashoffset: -1000; }
    }

    /* The foam breathes with the swell rather than on its own clock. */
    .foam {
      animation: foam 3.6s ease-in-out infinite;
    }
    @keyframes foam {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 0.45; }
    }

    @media (prefers-reduced-motion: reduce) {
      .swell,
      .foam { animation: none; }
    }
  </style>

  <!-- Plum ground. A transparent mark would vanish into a light tab bar
       on one browser and a dark one on the next; the disc makes the
       brass legible on both. -->
  <rect width="64" height="64" rx="14" fill="#2a1520" />

  <!-- One continuous stroke: the bowl opens at upper right, runs round,
       comes back up the right flank and tucks inward as the bar. That
       tuck is the closure — the wave arriving back at itself, and the
       thing that makes a C read as a G.

       Two strands, one colour at two values. Not two substances: one
       substance in two states, converging to a point at each free end so
       the pair reads as a single band. -->
