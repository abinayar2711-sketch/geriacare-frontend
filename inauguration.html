<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inauguration</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    position: relative;
    min-height: 100dvh;
    overflow: hidden;
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 700px at 50% -10%, #fff7ed 0%, transparent 60%),
      linear-gradient(180deg, #fffdf8 0%, #f7f2e8 100%);
    color: #3f2d1c;
    font-family: ui-serif, Georgia, "Times New Roman", serif;
  }

  .stage { position: relative; z-index: 3; text-align: center; padding: 2rem; }
  .kicker {
    letter-spacing: .28em; text-transform: uppercase;
    font-size: .68rem; color: #a1795a; margin: 0 0 .8rem;
    font-family: ui-sans-serif, system-ui, sans-serif;
  }
  h1 {
    margin: 0; font-size: clamp(2.4rem, 8vw, 4.6rem); font-weight: 500;
    letter-spacing: -.01em;
    background: linear-gradient(180deg, #7c4a1e, #c08a3e 60%, #8a5a24);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: .6rem 0 2.6rem; color: #7a614a; font-size: 1rem; }

  /* ---- ribbon ---- */
  .ribbon-wrap { position: relative; width: min(78vw, 560px); height: 96px; margin: 0 auto 2.4rem; }
  .post {
    position: absolute; top: -14px; width: 8px; height: 124px; border-radius: 4px;
    background: linear-gradient(180deg, #d9b475, #a97b3c);
    box-shadow: 0 6px 14px rgba(120, 85, 40, .25);
  }
  .post.left { left: -6px; }
  .post.right { right: -6px; }

  .half {
    position: absolute; top: 36px; height: 22px; width: 50%;
    background: linear-gradient(180deg, #f0576f, #c81e42 55%, #96122f);
    box-shadow: 0 8px 18px rgba(160, 20, 50, .25);
    transition: transform 1s cubic-bezier(.3,.8,.3,1), opacity 1.4s ease;
  }
  .half.l { left: 0; border-radius: 3px 0 0 3px; }
  .half.r { right: 0; border-radius: 0 3px 3px 0; }
  .bow {
    position: absolute; top: 50%; width: 34px; height: 34px; margin-top: -17px;
    background: linear-gradient(135deg, #ff8095, #c81e42);
    transform: rotate(45deg); border-radius: 6px;
  }
  .half.l .bow { right: -6px; }
  .half.r .bow { left: -6px; }
  .ribbon-wrap.cut .half.l { transform: translateX(-14%) rotate(-16deg) translateY(38px); opacity: .25; }
  .ribbon-wrap.cut .half.r { transform: translateX(14%) rotate(16deg) translateY(38px); opacity: .25; }

  /* ---- button ---- */
  button {
    font: inherit; font-size: 1rem; cursor: pointer;
    padding: .85rem 1.9rem; border-radius: 999px; color: #fffaf2;
    border: 1px solid rgba(255,255,255,.35);
    background: linear-gradient(180deg, #b8823c, #8a5a24);
    box-shadow: 0 10px 26px rgba(138, 90, 36, .35);
    display: inline-flex; align-items: center; gap: .6rem;
    transition: transform .18s ease, box-shadow .18s ease, opacity .3s ease;
  }
  button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(138,90,36,.42); }
  button:disabled { opacity: .55; cursor: default; }
  .blades { font-size: 1.15rem; }

  /* ---- balloons ---- */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  .balloons { z-index: 1; }
  .balloon { position: absolute; bottom: -220px; animation: rise linear infinite; }
  .bulb {
    position: relative;
    width: 52px; height: 66px; border-radius: 50% 50% 48% 48%;
    box-shadow: inset -8px -10px 18px rgba(0,0,0,.18), inset 8px 8px 16px rgba(255,255,255,.35);
    opacity: .85;
  }
  .bulb::after {
    content: ""; position: absolute; left: 21px; top: 64px;
    border-left: 5px solid transparent; border-right: 5px solid transparent;
    border-top: 8px solid rgba(0,0,0,.18);
  }
  .string { width: 1px; height: 90px; margin: 6px auto 0; background: linear-gradient(180deg, rgba(90,70,50,.5), transparent); }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) rotate(-3deg); }
    50%  { transform: translateY(-60vh) translateX(24px) rotate(4deg); }
    100% { transform: translateY(-125vh) translateX(-10px) rotate(-2deg); }
  }

  /* ---- sparkles ---- */
  .sparkles { z-index: 2; }
  .sparkle {
    position: absolute; border-radius: 50%;
    background: #e8b96a; box-shadow: 0 0 10px 2px rgba(232, 185, 106, .8);
    opacity: 0; animation: twinkle 3.4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.4); }
    50%      { opacity: .95; transform: scale(1.25); }
  }

  /* ---- confetti ---- */
  .confetti { z-index: 4; overflow: hidden; }
  .confetti span {
    position: absolute; top: -8vh; display: block;
    animation-name: fall; animation-timing-function: linear;
    animation-iteration-count: 1; animation-fill-mode: forwards;
  }
  @keyframes fall {
    0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(115vh) translateX(var(--drift, 0px)) rotate(760deg); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    .balloon, .sparkle, .confetti span { animation: none; }
    .half { transition: opacity .4s ease; }
  }
</style>
</head>
<body>

<div class="layer sparkles" id="sparkles" aria-hidden="true"></div>
<div class="layer balloons" id="balloons" aria-hidden="true"></div>
<div class="layer confetti" id="confetti" aria-hidden="true"></div>

<main class="stage">
  <p class="kicker">Geriacare</p>
  <h1>Inauguration</h1>
  <p class="sub" id="sub">Cut the ribbon to open The Long Room.</p>

  <div class="ribbon-wrap" id="ribbon">
    <div class="post left"></div>
    <div class="post right"></div>
    <div class="half l"><span class="bow"></span></div>
    <div class="half r"><span class="bow"></span></div>
  </div>

  <button id="cutBtn"><span class="blades">&#9986;</span><span id="btnLabel">Cut the ribbon</span></button>
</main>

<script>
(function () {
  var BALLOONS = [
    [4,  "#c2410c", 0,   9],   [14, "#0f766e", 1.4, 11],  [24, "#b45309", 2.6, 8.5],
    [36, "#7e22ce", 0.6, 10.5],[47, "#be123c", 3.2, 9.5], [58, "#047857", 1.1, 12],
    [69, "#1d4ed8", 2.1, 9],   [80, "#a16207", 0.3, 11.5],[90, "#db2777", 3.8, 10]
  ];
  var COLORS = ["#d97706","#0f766e","#be123c","#7e22ce","#1d4ed8","#65a30d","#f59e0b"];

  var balloonLayer = document.getElementById("balloons");
  BALLOONS.forEach(function (b) {
    var el = document.createElement("div");
    el.className = "balloon";
    el.style.left = b[0] + "%";
    el.style.animationDelay = b[2] + "s";
    el.style.animationDuration = b[3] + "s";
    el.innerHTML = '<div class="bulb" style="background:' + b[1] + '"></div><div class="string"></div>';
    balloonLayer.appendChild(el);
  });

  var sparkleLayer = document.getElementById("sparkles");
  for (var i = 0; i < 40; i++) {
    var s = document.createElement("span");
    var size = 3 + Math.floor(Math.random() * 6);
    s.className = "sparkle";
    s.style.left = (Math.random() * 100) + "%";
    s.style.top = (Math.random() * 100) + "%";
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.animationDelay = (Math.random() * 4) + "s";
    sparkleLayer.appendChild(s);
  }

  function burstConfetti() {
    var layer = document.getElementById("confetti");
    for (var i = 0; i < 110; i++) {
      var c = document.createElement("span");
      var size = 6 + Math.floor(Math.random() * 8);
      var round = Math.random() < 0.25;
      c.style.left = (Math.random() * 100) + "%";
      c.style.background = COLORS[Math.floor(Math.random() * COLORS.length)];
      c.style.width = size + "px";
      c.style.height = (round ? size : size * 1.8) + "px";
      c.style.borderRadius = round ? "50%" : "2px";
      c.style.animationDelay = (Math.random()) + "s";
      c.style.animationDuration = (2.4 + Math.random() * 3) + "s";
      c.style.setProperty("--drift", (Math.random() * 60 - 30) + "px");
      layer.appendChild(c);
    }
  }

  var done = false;
  var btn = document.getElementById("cutBtn");
  btn.addEventListener("click", function () {
    if (done) return;
    done = true;
    document.getElementById("ribbon").classList.add("cut");
    document.getElementById("sub").textContent = "The room is open.";
    document.getElementById("btnLabel").textContent = "Opening…";
    btn.disabled = true;
    burstConfetti();
    // open the blank page (popup if allowed, same tab otherwise)
    setTimeout(function () {
      location.href = "https://geriacare.in";
    }, 2400);
  });
})();
</script>
</body>
</html>
